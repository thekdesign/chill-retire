<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD3A1"/>
            <stop offset="50%" stop-color="#F47C1B"/>
            <stop offset="100%" stop-color="#D8682B"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFEBD2" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#FFEBD2" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1200" height="630" fill="url(#bg)"/>

    <!-- 太陽光暈 -->
    <circle cx="950" cy="200" r="280" fill="url(#sunGlow)"/>
    <circle cx="950" cy="200" r="80" fill="#FFF7EE"/>

    <!-- 棕櫚樹（左） -->
    <path d="M 200 600 Q 195 450 205 320 Q 210 240 220 200" stroke="#42391E" stroke-width="14" stroke-linecap="round" fill="none"/>
    <ellipse cx="210" cy="200" rx="85" ry="22" fill="#5E7F3F" transform="rotate(-12 210 200)"/>
    <ellipse cx="245" cy="180" rx="80" ry="20" fill="#779C53" transform="rotate(15 245 180)"/>
    <ellipse cx="180" cy="220" rx="70" ry="18" fill="#95B873" transform="rotate(-30 180 220)"/>

    <!-- 棕櫚樹（右） -->
    <path d="M 1020 600 Q 1025 450 1015 320 Q 1010 240 1000 200" stroke="#42391E" stroke-width="14" stroke-linecap="round" fill="none"/>
    <ellipse cx="1010" cy="200" rx="85" ry="22" fill="#5E7F3F" transform="rotate(12 1010 200)"/>
    <ellipse cx="975" cy="180" rx="80" ry="20" fill="#779C53" transform="rotate(-15 975 180)"/>
    <ellipse cx="1040" cy="220" rx="70" ry="18" fill="#95B873" transform="rotate(30 1040 220)"/>

    <!-- 吊床 -->
    <path d="M 220 320 Q 600 470 1010 320 Q 990 410 880 440 Q 600 480 350 440 Q 240 410 220 320 Z" fill="#FBF6EA" stroke="#7A3306" stroke-width="2"/>

    <!-- 品牌標 -->
    <g transform="translate(80, 80)">
        <circle cx="30" cy="30" r="22" fill="#FFFFFF"/>
        <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.95">
            <line x1="30" y1="2" x2="30" y2="10"/>
            <line x1="30" y1="50" x2="30" y2="58"/>
            <line x1="2" y1="30" x2="10" y2="30"/>
            <line x1="50" y1="30" x2="58" y2="30"/>
        </g>
        <text x="76" y="40" font-family="'Noto Sans TC', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">Chill Retire</text>
    </g>

    <!-- 主標 -->
    <text x="80" y="535" font-family="'Noto Sans TC', sans-serif" font-size="86" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
        算算你幾歲可以退休
    </text>
    <text x="80" y="592" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="500" fill="#FFFFFF" opacity="0.92">
        台灣本地化 · FIRE × 勞保勞退 × Monte Carlo · 5 分鐘看完整退休全景
    </text>
</svg>
